<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 265"><title>A local verification keeps the same test through comparison, repair and replay</title><rect width="740" height="265" fill="white"/><g font-family="monospace" fill="#18181b"><text x="28" y="37" font-size="19" font-weight="bold">Keep the check. Change the source.</text><path d="M71 99H285M317 99H531" stroke="#a1a1aa"/><path d="M278 94L285 99L278 104M524 94L531 99L524 104" fill="none" stroke="#a1a1aa"/><g fill="white" stroke="#ea580c"><circle cx="52" cy="99" r="18"/><circle cx="298" cy="99" r="18"/><circle cx="544" cy="99" r="18"/></g><g font-size="12" text-anchor="middle" fill="#ea580c"><text x="52" y="103">01</text><text x="298" y="103">02</text><text x="544" y="103">03</text></g><g font-size="18" font-weight="bold"><text x="28" y="157">Compare</text><text x="274" y="157">Repair</text><text x="520" y="157">Replay</text></g><g font-size="13" fill="#52525b"><text x="28" y="188">Base passes.</text><text x="28" y="211">Change fails.</text><text x="274" y="188">Fix URL matching.</text><text x="274" y="211">Keep tests intact.</text><text x="520" y="188">Fresh sandbox VMs.</text><text x="520" y="211">Same check, same result.</text></g><text x="28" y="247" font-size="11" fill="#52525b">The reproducer stays identical across the captured versions.</text></g></svg>