<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc"><title id="title">tinygrad JIT input binding</title><desc id="desc">A captured return is rebound to the current input. CPU result: 84 passed, zero failed, ten skipped.</desc><defs><pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="#8a816d"/></pattern></defs>
<rect width="900" height="650" fill="#ede7da"/><rect width="900" height="650" fill="url(#dots)" opacity=".25"/>
<path d="M70 100V72H98M802 72H830V100M70 550V578H98M802 578H830V550" stroke="#252722" stroke-width="4" fill="none"/>
<g font-family="monospace" fill="#20231f"><text x="117" y="136" font-size="20" letter-spacing="3" fill="#b74408">TINYGRAD / JIT</text><text x="117" y="190" font-size="34" font-weight="700">Return the current input.</text>
<rect x="117" y="233" width="666" height="249" fill="#1c211c"/><g stroke="#7a826f" fill="#2c332b"><rect x="160" y="292" width="224" height="66"/><rect x="519" y="292" width="224" height="66"/></g><g fill="#f4f0e6" text-anchor="middle" font-size="24"><text x="272" y="333">input slot</text><text x="631" y="333">return</text></g>
<path d="M384 326H516M503 316 518 326 503 336" fill="none" stroke="#f18846" stroke-width="3"/><rect x="443" y="321" width="16" height="10" fill="#f18846"/>
<text x="450" y="424" text-anchor="middle" font-size="17" fill="#b7c4b2">Bind once per invocation.</text><text x="117" y="535" font-size="20" font-weight="700" fill="#237047">84 PASS</text><text x="388" y="535" font-size="20" font-weight="700">0 FAIL</text><text x="625" y="535" font-size="20" fill="#68635c">10 SKIP</text></g></svg>
