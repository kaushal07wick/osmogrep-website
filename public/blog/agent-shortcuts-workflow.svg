<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title desc"><title id="title">From a bounded hypothesis to runtime evidence</title><desc id="desc">The implemented Rust engine screens changes and records hypotheses. A dashed bridge marks the unvalidated integration to the separate existing local VM workflow. Explicit sandbox comparison preserves original tests and exports scoped evidence.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#18181B" stroke-width="1.2"/></marker></defs><rect width="960" height="700" fill="#F9F8F5"/><g font-family="monospace"><text x="36" y="42" font-size="23" fill="#18181B" font-weight="bold">A hypothesis becomes evidence through execution.</text><text x="36" y="72" font-size="15" fill="#52525B" >Current components, with the unfinished connection made explicit.</text><text x="36" y="114" font-size="13" fill="#9A3412" >RUST ENGINE / IMPLEMENTED LOCALLY</text></g><g fill="white" stroke="#d4d2cc"><rect x="36" y="132" width="888" height="80"/><rect x="36" y="240" width="888" height="80"/><rect x="36" y="434" width="888" height="80"/><rect x="36" y="542" width="888" height="80"/></g><g font-family="monospace"><text x="58" y="180" font-size="26" fill="#EA580C" >01</text><text x="116" y="164" font-size="19" fill="#18181B" font-weight="bold">Screen the change; bind exact revisions.</text><text x="116" y="190" font-size="14" fill="#52525B" >Resource context + deterministic rules + durable budgets</text><text x="58" y="288" font-size="26" fill="#EA580C" >02</text><text x="116" y="272" font-size="19" fill="#18181B" font-weight="bold">Record a hypothesis and independent oracle.</text><text x="116" y="298" font-size="14" fill="#52525B" >Declared invariant + assumptions + resource history</text><text x="36" y="421" font-size="13" fill="#9A3412" >LOCAL VM MCP WORKFLOW / SEPARATELY DEMONSTRATED</text><text x="58" y="482" font-size="26" fill="#EA580C" >03</text><text x="116" y="466" font-size="19" fill="#18181B" font-weight="bold">Request an explicit base / candidate comparison.</text><text x="116" y="492" font-size="14" fill="#52525B" >Identical reproducer + equivalent environment + captured source</text><text x="58" y="590" font-size="26" fill="#EA580C" >04</text><text x="116" y="574" font-size="19" fill="#18181B" font-weight="bold">Preserve original tests; export a scoped outcome.</text><text x="116" y="600" font-size="14" fill="#52525B" >Reproduced · not reproduced · inconclusive · execution failure</text></g><g stroke="#18181B" fill="none" stroke-width="1.5" marker-end="url(#arrow)"><path d="M480 212V232"/><path d="M480 514V534"/></g><path d="M480 320V425" stroke="#EA580C" stroke-width="2" stroke-dasharray="5 5"/><rect x="178" y="343" width="604" height="46" fill="#F9F8F5" stroke="#EA580C" stroke-dasharray="5 5"/><g font-family="monospace"><text x="480" y="371" font-size="14" fill="#9A3412" text-anchor="middle">PLANNED BRIDGE / LIVE NORMALIZATION UNVALIDATED</text><text x="36" y="662" font-size="15" fill="#18181B" >Execution evidence stays separate from the agent’s verdict.</text><text x="36" y="685" font-size="12" fill="#52525B" >Diagram shows integration boundaries, not an already connected hosted service.</text></g></svg>