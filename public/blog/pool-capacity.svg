<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="title desc"><title id="title">Two safe changes exceed the shared capacity when combined</title><desc id="desc">Controlled declared configurations: base has 16 pool slots and 8 workers. Change A has 8 slots and 8 workers. Change B has 16 slots and 16 workers. Combined has 8 slots and 16 workers. The fixture requires all workers to hold a slot during overlap with nonblocking acquisition.</desc><rect width="960" height="610" fill="#F9F8F5"/><g font-family="monospace"><text x="32" y="42" font-size="24" fill="#18181B" font-weight="bold">Each branch fits. Together, demand exceeds capacity.</text><text x="32" y="72" font-size="15" fill="#52525B" >Controlled fixture declarations / pool slots and concurrent workers</text><rect x="32" y="94" width="13" height="13" fill="#18181B"/><text x="54" y="106" font-size="13" fill="#52525B" >Pool slots</text><rect x="197" y="94" width="13" height="13" fill="#EA580C"/><text x="219" y="106" font-size="13" fill="#52525B" >Workers</text><path d="M255 145V500" stroke="#d4d2cc" stroke-dasharray="2 5"/><text x="255" y="135" font-size="12" fill="#52525B" text-anchor="middle">0</text><path d="M383 145V500" stroke="#d4d2cc" stroke-dasharray="2 5"/><text x="383" y="135" font-size="12" fill="#52525B" text-anchor="middle">4</text><path d="M511 145V500" stroke="#d4d2cc" stroke-dasharray="2 5"/><text x="511" y="135" font-size="12" fill="#52525B" text-anchor="middle">8</text><path d="M639 145V500" stroke="#d4d2cc" stroke-dasharray="2 5"/><text x="639" y="135" font-size="12" fill="#52525B" text-anchor="middle">12</text><path d="M767 145V500" stroke="#d4d2cc" stroke-dasharray="2 5"/><text x="767" y="135" font-size="12" fill="#52525B" text-anchor="middle">16</text><text x="32" y="188" font-size="18" fill="#18181B" >Base</text><rect x="255" y="163" width="512" height="21" fill="#18181B"/><rect x="255" y="190" width="256" height="21" fill="#EA580C"/><text x="779" y="179" font-size="14" fill="#18181B" >16</text><text x="523" y="206" font-size="14" fill="#9A3412" >8</text><text x="32" y="275" font-size="18" fill="#18181B" >Change A</text><rect x="255" y="250" width="256" height="21" fill="#18181B"/><rect x="255" y="277" width="256" height="21" fill="#EA580C"/><text x="523" y="266" font-size="14" fill="#18181B" >8</text><text x="523" y="293" font-size="14" fill="#9A3412" >8</text><text x="32" y="362" font-size="18" fill="#18181B" >Change B</text><rect x="255" y="337" width="512" height="21" fill="#18181B"/><rect x="255" y="364" width="512" height="21" fill="#EA580C"/><text x="779" y="353" font-size="14" fill="#18181B" >16</text><text x="779" y="380" font-size="14" fill="#9A3412" >16</text><text x="32" y="449" font-size="18" fill="#18181B" font-weight="bold">Combined</text><rect x="255" y="424" width="256" height="21" fill="#18181B"/><rect x="255" y="451" width="512" height="21" fill="#EA580C"/><text x="523" y="440" font-size="14" fill="#18181B" >8</text><text x="779" y="467" font-size="14" fill="#9A3412" >16</text><path d="M511 475V488H767V475" stroke="#EA580C" fill="none"/><text x="639" y="505" font-size="13" fill="#9A3412" text-anchor="middle">8 workers exceed the bound</text><text x="32" y="559" font-size="14" fill="#18181B" >Assumption: every worker holds one slot through the shared barrier.</text><text x="32" y="583" font-size="13" fill="#52525B" >Acquisition is nonblocking. This is a synthetic contract, not production telemetry.</text></g></svg>